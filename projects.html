
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Projects | Capricorn Epoxy Enterprise</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f7fb;
            color: #222;
        }

        header {
            background: #542477;
            color: white;
            text-align: center;
            padding: 35px 15px;
        }

        header h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 15px;
            opacity: 0.9;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 35px 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .section-title h2 {
            color: #542477;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .section-title p {
            color: #666;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .project-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
        }

        .project-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        .project-info {
            padding: 15px;
            text-align: center;
        }

        .project-info h3 {
            color: #542477;
            font-size: 17px;
        }

        footer {
            background: #542477;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        /* Image preview */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            inset: 0;
            background: rgba(0,0,0,0.92);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .lightbox img {
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }

        @media (max-width: 900px) {
            .projects-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            header h1 {
                font-size: 24px;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }

            .project-card img {
                height: 260px;
            }

            .container {
                padding: 25px 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Our Projects</h1>
        <p>Capricorn Epoxy Enterprise | Epoxy Flooring Excellence</p>
    </header>

    <main class="container">

        <div class="section-title">
            <h2>Our Completed Projects</h2>
            <p>Explore our epoxy flooring designs and completed works.</p>
        </div>

        <div class="projects-grid" id="projectsGrid">
        </div>

    </main>

    <div class="lightbox" id="lightbox">
        <span class="close" onclick="closeImage()">&times;</span>
        <img id="lightboxImage" src="" alt="Project Preview">
    </div>

    <footer>
        <p>&copy; 2026 Capricorn Epoxy Enterprise. All Rights Reserved.</p>
    </footer>

    <script>
        const projectsGrid = document.getElementById("projectsGrid");

        for (let i = 1; i <= 44; i++) {

            const card = document.createElement("div");
            card.className = "project-card";

            const image = document.createElement("img");

            image.src = `images/project${i}.jpg`;
            image.alt = `Capricorn Epoxy Project ${i}`;
            image.loading = "lazy";

            image.onerror = function () {
                card.style.display = "none";
            };

            image.onclick = function () {
                openImage(this.src);
            };

            const info = document.createElement("div");
            info.className = "project-info";

            const title = document.createElement("h3");
            title.textContent = `Project ${i}`;

            info.appendChild(title);
            card.appendChild(image);
            card.appendChild(info);

            projectsGrid.appendChild(card);
        }

        function openImage(src) {
            document.getElementById("lightboxImage").src = src;
            document.getElementById("lightbox").style.display = "flex";
        }

        function closeImage() {
            document.getElementById("lightbox").style.display = "none";
        }

        document.getElementById("lightbox").onclick = function (event) {
            if (event.target === this) {
                closeImage();
            }
        };
    </script>

</body>
</html>
